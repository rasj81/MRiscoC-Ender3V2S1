name: Build custom firmware

# Run from the Actions tab: pick a saved preset, or choose "custom" and set the
# options below (same choices as the Special_Configurations Configurator).
# "ALL" builds every file in presets/. To add a preset, add presets/<name>.json
# and add <name> to the preset list below.
#
# Also runs on the 1st of every month (all presets, latest upstream firmware).
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: "Branch, tag or commit of the firmware source. Blank = latest bugfix (default branch); 'stable' = newest New-Year-#### branch. Note: 'Use workflow from' above only picks which branch's workflow/presets run."
        type: string
        default: ""
      firmware_source:
        description: "Firmware source: latest mriscoc upstream, or this fork's own copy"
        type: choice
        default: upstream-latest
        options: [upstream-latest, this-fork]
      preset:
        description: "Saved preset (custom = use the options below, ALL = every preset)"
        type: choice
        default: ender3v2-sprite
        options: [custom, ALL, ender3v2-sprite, ender3v2-bowden]
      env:
        description: "Custom only: PlatformIO environment (RET6 board = STM32F103RE_creality)"
        type: string
        default: STM32F103RE_creality
      printer:
        description: "Custom only: printer"
        type: choice
        default: Ender3V2
        options: [Ender3V2, Ender3V2Neo, Ender3, Ender3S1, Ender3MaxNeo, Ender2Pro, Ender5Pro, Aquila]
      board:
        description: "Custom only: board"
        type: choice
        default: "422"
        options: ["301F1", "301F4", "422", "423", "427", CR4NTF4, G32, SKRME3V2, SKRME3V3]
      display:
        description: "Custom only: display"
        type: choice
        default: DWIN
        options: [DWIN, CR10DSPLY, DACAI, SYNWIT, TJC]
      leveling:
        description: "Custom only: bed leveling / probe"
        type: choice
        default: BLT
        options: [BLT, AutoLev, BQMPv2, EZABLZI, EZABLZN, MM, UBL]
      ubl:
        description: "Custom only: add UBL on top of the probe"
        type: boolean
        default: true
      thermistor:
        description: "Custom only: thermistor (stock = firmware default, type 1)"
        type: choice
        default: stock
        options: [stock, T1, T5, T13, T20]
      la:
        description: "Custom only: Linear Advance (LA)"
        type: boolean
        default: true
      is:
        description: "Custom only: Input Shaping (IS)"
        type: boolean
        default: true
      mpc:
        description: "Custom only: Model Predictive Control (MPC)"
        type: boolean
        default: true
      np:
        description: "Custom only: NP"
        type: boolean
        default: false
      homeoffs:
        description: "Custom only: HomeOffs"
        type: boolean
        default: false
      locksteppers:
        description: "Custom only: LockSteppers"
        type: boolean
        default: false
      corexy:
        description: "Custom only: CoreXY"
        type: boolean
        default: false
      cvlm:
        description: "Custom only: CVLM"
        type: boolean
        default: false
      freeflash:
        description: "Custom only: FreeFlash"
        type: boolean
        default: false
      repeat_depth:
        description: "Custom only: Repeat&Depth"
        type: boolean
        default: false
      sdreadonly:
        description: "Custom only: SDReadOnly"
        type: boolean
        default: false
      speaker:
        description: "Custom only: Speaker"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    # Keep this fork in step with mriscoc/Ender3V2S1 at the start of every build.
    # Builds read the firmware straight from upstream, so a failed sync only
    # matters (and then fails the run) when firmware_source is this-fork.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork branches with upstream
        continue-on-error: ${{ inputs.firmware_source != 'this-fork' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.firmware_ref }}
        run: |
          repo="${{ github.repository }}"
          default="$(gh api "repos/$repo" --jq .default_branch)"
          branches="$default"
          case "$REF" in ""|stable|*[!A-Za-z0-9._/-]*) ;; *) [ "$REF" = "$default" ] || branches="$branches $REF";; esac
          status=0
          for b in $branches; do
            if out="$(gh api -X POST "repos/$repo/merge-upstream" -f branch="$b" 2>&1)"; then
              echo "- \`$b\`: $(echo "$out" | jq -r .message)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$b\`: sync FAILED: $out" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::sync of $b failed: $out"
              [ "$b" = "$default" ] && status=1
            fi
          done
          exit $status

  plan:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: python3 ci/plan.py

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.firmware_ref }}
          path: fw
      - uses: actions/checkout@v4
        with:
          repository: mriscoc/Special_Configurations
          path: gen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('fw/platformio.ini', 'fw/ini/**') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.env }}-
      - run: pip install platformio
      - name: Generate and check configuration
        run: |
          python3 ci/build.py --gen gen --target fw --name "${{ matrix.name }}" --machine-name "${{ matrix.machine_name }}" \
            --features "$(echo '${{ toJSON(matrix.features) }}' | python3 -c 'import sys,json;print(",".join(json.load(sys.stdin)))')"
      - name: Compile
        working-directory: fw
        run: |
          set +e
          platformio run -e "${{ matrix.env }}" 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the cause as annotations (visible without downloading logs).
            grep -n -i -E "error|\*\*\*|fatal|undefined reference|region .* overflowed|No such file" ../build.log \
              | grep -v -i "werror" | head -8 | cut -c1-230 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::notice::last log lines: $(tail -n 6 ../build.log | tr '\n' '|' | cut -c1-400)"
          fi
          exit $rc
      - name: Name the firmware like the Configurator, plus branch and date
        id: pkg
        env:
          FW_REF: ${{ matrix.firmware_ref }}
        run: |
          mkdir -p dist
          set -- fw/.pio/build/${{ matrix.env }}/*.bin
          [ "$#" -eq 1 ] || { echo "expected exactly one .bin, found $#: $*"; exit 1; }
          ref="$(git -C fw rev-parse --abbrev-ref HEAD)"
          # detached HEAD (tag or commit): use the requested ref, else the short SHA
          if [ "$ref" = "HEAD" ]; then ref="$FW_REF"; fi
          [ -n "$ref" ] || ref="$(git -C fw rev-parse --short HEAD)"
          branch="$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '-')"
          branch="${branch#Ender3V2S1-}"   # Ender3V2S1-Bugfix -> Bugfix
          base="${{ matrix.name }}-${branch}-${{ matrix.date }}"
          cp "$1" "dist/${base}.bin"
          sha256sum dist/*.bin | tee dist/SHA256SUMS.txt
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - name: Add matching display assets
        run: python3 ci/display.py --fw fw --display "${{ matrix.display }}" --out dist/display
      - name: Summary
        run: |
          {
            echo "### ${{ steps.pkg.outputs.base }}.bin"
            echo "- preset: \`${{ matrix.label }}\`"
            echo "- firmware branch/ref: \`$(git -C fw rev-parse --abbrev-ref HEAD)\`"
            echo "- options: \`${{ join(matrix.features, ' ') }}\`"
            echo "- environment: \`${{ matrix.env }}\`"
            echo "- firmware source: \`${{ matrix.source_repo }}\` @ \`$(git -C fw rev-parse --short HEAD)\`"
            echo "- generator commit: \`$(git -C gen rev-parse --short HEAD)\`"
            ls -l dist/*.bin
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.base }}
          path: |
            dist/**
            fw/Marlin/Configuration.h
            fw/Marlin/Configuration_adv.h
            fw/Marlin/Version.h
          if-no-files-found: error
